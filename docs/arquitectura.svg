<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arrowBlocked" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <style>
      .title   { font-size: 26px; font-weight: 700; fill: #1b2430; }
      .subtitle{ font-size: 14px; fill: #5b6472; }
      .boxTitle{ font-size: 15px; font-weight: 700; }
      .boxDesc { font-size: 12px; }
      .edge    { font-size: 12px; fill: #5b6472; }
      .badge   { font-size: 11px; font-weight: 700; }
      .zone    { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="40" y="48" class="title">Ritmo — arquitectura del agente</text>
  <text x="40" y="72" class="subtitle">El agente nunca toca la base de datos. Solo llama a una herramienta, y la herramienta le pide los datos a un servicio.</text>

  <!-- Runtime zone (AgentCore) -->
  <rect x="290" y="110" width="400" height="380" rx="14" fill="#eef2fb" stroke="#c7d3ef" stroke-width="1.5"/>
  <text x="310" y="136" class="zone" fill="#3b5bdb">AMAZON BEDROCK AGENTCORE RUNTIME</text>

  <!-- Data zone -->
  <rect x="730" y="110" width="230" height="380" rx="14" fill="#eefaf3" stroke="#bfe6cf" stroke-width="1.5"/>
  <text x="750" y="136" class="zone" fill="#2f9e60">FRONTERA DE DATOS</text>

  <!-- User -->
  <rect x="40" y="255" width="180" height="90" rx="12" fill="#ffffff" stroke="#d4dae3" stroke-width="1.5"/>
  <text x="130" y="293" text-anchor="middle" class="boxTitle" fill="#1b2430">Usuario</text>
  <text x="130" y="315" text-anchor="middle" class="boxDesc" fill="#5b6472">Pregunta por su plan,</text>
  <text x="130" y="331" text-anchor="middle" class="boxDesc" fill="#5b6472">actividad, facturación</text>

  <!-- Agent -->
  <rect x="320" y="165" width="340" height="120" rx="12" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="490" y="196" text-anchor="middle" class="boxTitle" fill="#1b2430">Agente Ritmo</text>
  <text x="490" y="220" text-anchor="middle" class="boxDesc" fill="#5b6472">Modelo + instrucciones + loop</text>
  <text x="490" y="238" text-anchor="middle" class="boxDesc" fill="#5b6472">Strands  o  LangGraph</text>
  <rect x="360" y="250" width="100" height="22" rx="11" fill="#eef2fb"/>
  <text x="410" y="265" text-anchor="middle" class="badge" fill="#3b5bdb">agente.py</text>
  <rect x="470" y="250" width="150" height="22" rx="11" fill="#eef2fb"/>
  <text x="545" y="265" text-anchor="middle" class="badge" fill="#3b5bdb">agente_langgraph.py</text>

  <!-- Tool -->
  <rect x="320" y="320" width="340" height="82" rx="12" fill="#ffffff" stroke="#7048e8" stroke-width="2"/>
  <text x="490" y="349" text-anchor="middle" class="boxTitle" fill="#1b2430">Herramienta: consultar_cuenta</text>
  <text x="490" y="372" text-anchor="middle" class="boxDesc" fill="#5b6472">El contrato. Recibe usuario_id,</text>
  <text x="490" y="389" text-anchor="middle" class="boxDesc" fill="#5b6472">devuelve un resumen. Nunca ve la base.</text>

  <!-- Memory -->
  <rect x="320" y="420" width="340" height="56" rx="12" fill="#fff8ec" stroke="#e0a63b" stroke-width="1.5"/>
  <text x="490" y="442" text-anchor="middle" class="boxDesc" fill="#8a5a00" font-weight="700">AgentCore Memory</text>
  <text x="490" y="460" text-anchor="middle" class="boxDesc" fill="#8a5a00">recuerda al usuario entre sesiones (agente_memoria.py)</text>

  <!-- Service -->
  <rect x="750" y="235" width="190" height="90" rx="12" fill="#ffffff" stroke="#2f9e60" stroke-width="2"/>
  <text x="845" y="267" text-anchor="middle" class="boxTitle" fill="#1b2430">servicio_datos.py</text>
  <text x="845" y="289" text-anchor="middle" class="boxDesc" fill="#5b6472">Única capa que habla</text>
  <text x="845" y="305" text-anchor="middle" class="boxDesc" fill="#5b6472">con los datos</text>

  <!-- Datastore -->
  <path d="M793 388 a52 13 0 0 1 104 0 v42 a52 13 0 0 1 -104 0 Z" fill="#ffffff" stroke="#2f9e60" stroke-width="2"/>
  <ellipse cx="845" cy="388" rx="52" ry="13" fill="#ffffff" stroke="#2f9e60" stroke-width="2"/>
  <text x="845" y="416" text-anchor="middle" class="boxDesc" fill="#5b6472">Datos de cuentas</text>

  <!-- Bedrock model -->
  <rect x="320" y="512" width="340" height="70" rx="12" fill="#ffffff" stroke="#d4dae3" stroke-width="1.5"/>
  <text x="490" y="542" text-anchor="middle" class="boxTitle" fill="#1b2430">Amazon Bedrock</text>
  <text x="490" y="564" text-anchor="middle" class="boxDesc" fill="#5b6472">Modelo Claude (Converse API)</text>

  <!-- Edges -->
  <!-- user <-> agent -->
  <line x1="220" y1="288" x2="316" y2="245" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="316" y1="258" x2="222" y2="303" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="248" y="255" class="edge">pregunta</text>
  <text x="248" y="322" class="edge">respuesta</text>

  <!-- agent -> tool -->
  <line x1="490" y1="285" x2="490" y2="316" stroke="#7048e8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="502" y="306" class="edge" fill="#7048e8">llama</text>

  <!-- tool -> service -->
  <line x1="660" y1="360" x2="746" y2="300" stroke="#2f9e60" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="648" y="332" class="edge" fill="#2f9e60">obtener_cuenta()</text>

  <!-- service -> datastore -->
  <line x1="845" y1="325" x2="845" y2="370" stroke="#2f9e60" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- agent -> bedrock -->
  <line x1="490" y1="402" x2="490" y2="508" stroke="#5b6472" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="502" y="470" class="edge">razona con el modelo</text>

  <!-- Blocked direct access agent -> datastore -->
  <path d="M660 345 C 720 370, 740 400, 792 408" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlocked)"/>
  <line x1="704" y1="366" x2="724" y2="386" stroke="#c0392b" stroke-width="3"/>
  <line x1="724" y1="366" x2="704" y2="386" stroke="#c0392b" stroke-width="3"/>
  <text x="668" y="470" class="edge" fill="#c0392b" font-weight="700">acceso directo prohibido</text>

  <!-- Legend -->
  <rect x="40" y="575" width="240" height="60" rx="8" fill="#ffffff" stroke="#e2e6ec"/>
  <line x1="56" y1="595" x2="86" y2="595" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="94" y="599" class="edge">flujo permitido</text>
  <line x1="56" y1="617" x2="86" y2="617" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowBlocked)"/>
  <text x="94" y="621" class="edge" fill="#c0392b">flujo bloqueado por diseño</text>
</svg>
